<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="author" content="Jérémie Boulay">
  <meta name="owner" content="Jérémie Boulay">
  <meta name="location" content="Paris, FRANCE">
  <meta name="keywords" content="scribble, lab, creative developer">
  <meta name="description" content="">
  <meta name="copyright" content="© Copyright 2020 - Jérémie Boulay" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@jeremboo">
  <meta name="twitter:creator" content="@jeremboo">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="">
  <meta name="twitter:image:src" content="">
  <!-- Facebook -->
  <!-- <meta property="og:title" content="{{title}}"/>
  <meta property="og:image" content=""/>
  <meta property="og:url" content=""/>
  <meta property="og:site-name" content=""/> -->

  <meta name="viewport" content="width=device-width, shrink-to-fit=0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>{{title}}</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
      color: #070707;
      font-family: Century Gothic,CenturyGothic,AppleGothic,sans-serif
    }
    canvas {
      margin: auto;
      display: block;
      box-shadow: 0px 2px 12px -2px rgba(0, 0, 0, 0.15);
    }
    .f {
      position: absolute;
      bottom: 5px;
      right: 15px;
      font-family: 'Arial';
      font-size: 0.7rem;
      text-align: center;
    }
    .f a {
      color: #C9F0FF;
      font-size: 0.8rem;
    }

    a {
      text-decoration: none;
      color: white;
      display: block;
      cursor: pointer;
      transition: color 250ms;
    }

    a:hover {
      color: #B44351
    }

    #wrapper-3d {
      /* Center without CSS transform — parent transforms break CSS3D perspective. */
      position: absolute;
      inset: 0;
      margin: auto;
      font-size: 1px;
      pointer-events: none;
    }

    #wrapper-3d .content {
      width: 1500px;
      height: 1000px;
    }

    #wrapper-3d h1 {
      font-size: 150px;
      line-height: 150px;
      margin:0;
      padding: 0;
      color: white;
    }

    #wrapper-3d a {
      font-size: 70px;
      line-height: 70px;
    }

    #home-page > * {
      opacity: 0;
      transform: translateY(50px);
    }

    #home-page button {
      font-size: 100px;
      transform: translate(0, 0);
      transform-origin: 0 0;
      border: 0;
      cursor: pointer;
      background-color: white;
      transition: background-color 0.25s, transform 0.25s;
      border-radius: 11px;
      margin-left: 10px;
      margin-top: 80px;
      padding: 10px 50px;
    }

    #home-page button:hover {
      transform: translate(10px, 0);
      background-color: #B44351;
    }

    button::-moz-focus-inner {
      border: 0;
      padding: 0;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 1;
      transition: opacity 0.5s;
    }

    .hidden, .hidden button, .hidden a {
      pointer-events: none !important;
      opacity: 0 !important;
    }

    p {
      margin: 5px;
      color: white;
    }

    /* ── Card hand overlay (inline: canvas-sketch middleware can stub style.css) ── */
    :root {
      --card-face: #f4efe6;
      --card-ink: #1c1814;
      --card-accent: #b44351;
    }

    .card-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .card-ui.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .card-hand-root {
      position: absolute;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .card-hand-targets,
    .card-hand-cards {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .game-card {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      padding: 0;
      border: 2px solid rgba(28, 24, 20, 0.85);
      border-radius: 10px;
      background: linear-gradient(160deg, #fff8ee 0%, var(--card-face) 55%, #e8dfd2 100%);
      color: var(--card-ink);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35em;
      font-family: Century Gothic, CenturyGothic, AppleGothic, sans-serif;
      will-change: transform;
      transform-origin: center center;
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
    }

    .game-card:focus {
      outline: none;
    }

    .game-card:focus-visible {
      box-shadow:
        0 0 0 3px rgba(110, 212, 196, 0.7),
        0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .game-card.is-dragging {
      cursor: grabbing;
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .game-card__value {
      font-size: clamp(1.4rem, 4.5vh, 2.6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .game-card__type {
      font-size: clamp(0.55rem, 1.4vh, 0.85rem);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      opacity: 0.65;
    }

    .card-drop-target {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid transparent;
      background: transparent;
      pointer-events: none;
    }

    .card-drop-target.is-debug {
      border-color: red;
    }

    /* ── Run stats (debug HUD) ── */
    #run-stats-debug {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 40;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(12, 10, 8, 0.72);
      color: #f4efe6;
      font-family: Century Gothic, CenturyGothic, AppleGothic, sans-serif;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #run-stats-debug.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #run-stats-debug h3 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
      font-weight: 600;
    }

    #run-stats-debug dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
    }

    #run-stats-debug dt {
      opacity: 0.55;
    }

    #run-stats-debug dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #run-stats-debug .cards-line {
      grid-column: 1 / -1;
      margin-top: 4px;
      opacity: 0.8;
      word-break: break-word;
      text-align: left;
    }

    /* ── Game over ── */
    #game-over {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 6, 4, 0.72);
      color: #f4efe6;
      font-family: Century Gothic, CenturyGothic, AppleGothic, sans-serif;
      transition: opacity 0.45s;
      box-sizing: border-box;
    }

    #game-over.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .game-over__panel {
      width: min(420px, 100%);
      padding: 28px 28px 24px;
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(40, 32, 24, 0.95), rgba(18, 14, 10, 0.96));
      border: 1px solid rgba(244, 239, 230, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .game-over__panel h2 {
      margin: 0 0 4px;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: -0.02em;
    }

    .game-over__panel .subtitle {
      margin: 0 0 18px;
      opacity: 0.55;
      font-size: 0.85rem;
    }

    .game-over__stats {
      margin: 0 0 22px;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-over__stats li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(244, 239, 230, 0.08);
      font-size: 0.95rem;
    }

    .game-over__stats li span:first-child {
      opacity: 0.55;
      flex-shrink: 0;
    }

    .game-over__stats li span:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .game-over__stats .cards-detail {
      flex-direction: column;
      gap: 4px;
    }

    .game-over__stats .cards-detail span:last-child {
      text-align: left;
      opacity: 0.85;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .game-over__actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .game-over__actions button {
      flex: 1 1 140px;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, color 0.2s;
    }

    #restart-button {
      background: #f4efe6;
      color: #1c1814;
    }

    #restart-button:hover {
      background: #b44351;
      color: #fff;
      transform: translateY(-1px);
    }

    #share-button {
      background: transparent;
      color: #f4efe6;
      box-shadow: inset 0 0 0 1.5px rgba(244, 239, 230, 0.45);
    }

    #share-button:hover {
      background: rgba(244, 239, 230, 0.1);
      transform: translateY(-1px);
    }

  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="wrapper-3d">
    <div class="content">
      <header id="home-page" class="page">
        <h1>Infinite board game</h1>
        <a href="https://www.jeremieboulay.fr" target="_blank">@jeremboo</a>
        <div>
          <button id="start-button">Start</button>
        </div>
      </header>
      <div id="game-page" class="page hidden"></div>
    </div>
  </div>

  <!-- Card UI overlay (DOM renderer). Pointer events enabled; engine stays renderer-agnostic. -->
  <div id="card-ui" class="card-ui hidden" aria-hidden="true"></div>

  <aside id="run-stats-debug" class="hidden" aria-hidden="true">
    <h3>Run stats</h3>
    <dl>
      <dt>Sections</dt><dd id="debug-sections">0</dd>
      <dt>Cards used</dt><dd id="debug-cards-used">0</dd>
      <dt>Time</dt><dd id="debug-time">0s</dd>
      <dt>Avg think</dt><dd id="debug-think">—</dd>
      <dt>Loots</dt><dd id="debug-loots">0</dd>
      <dd class="cards-line" id="debug-cards-list"></dd>
    </dl>
  </aside>

  <div id="game-over" class="hidden" aria-hidden="true" role="dialog" aria-labelledby="game-over-title">
    <div class="game-over__panel">
      <h2 id="game-over-title">Game over</h2>
      <p class="subtitle">No cards left</p>
      <ul class="game-over__stats">
        <li><span>Distance</span><span id="go-sections">0 sections</span></li>
        <li class="cards-detail">
          <span>Cards used</span>
          <span id="go-cards">0</span>
        </li>
        <li><span>Run time</span><span id="go-time">0s</span></li>
        <li><span>Avg think / turn</span><span id="go-think">—</span></li>
        <li><span>Loots</span><span id="go-loots">0</span></li>
      </ul>
      <div class="game-over__actions">
        <button type="button" id="restart-button">Restart</button>
        <button type="button" id="share-button">Copy stats</button>
      </div>
    </div>
  </div>

  {{entry}}


</body>
</html>
