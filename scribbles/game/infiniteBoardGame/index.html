<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="author" content="Jérémie Boulay">
  <meta name="owner" content="Jérémie Boulay">
  <meta name="location" content="Paris, FRANCE">
  <meta name="keywords" content="scribble, lab, creative developer">
  <meta name="description" content="">
  <meta name="copyright" content="© Copyright 2020 - Jérémie Boulay" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@jeremboo">
  <meta name="twitter:creator" content="@jeremboo">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="">
  <meta name="twitter:image:src" content="">
  <!-- Facebook -->
  <!-- <meta property="og:title" content="{{title}}"/>
  <meta property="og:image" content=""/>
  <meta property="og:url" content=""/>
  <meta property="og:site-name" content=""/> -->

  <meta name="viewport" content="width=device-width, shrink-to-fit=0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>{{title}}</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
      color: #070707;
      font-family: Century Gothic,CenturyGothic,AppleGothic,sans-serif
    }
    canvas {
      margin: auto;
      display: block;
      box-shadow: 0px 2px 12px -2px rgba(0, 0, 0, 0.15);
    }
    .f {
      position: absolute;
      bottom: 5px;
      right: 15px;
      font-family: 'Arial';
      font-size: 0.7rem;
      text-align: center;
    }
    .f a {
      color: #C9F0FF;
      font-size: 0.8rem;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- DOM UI overlays, sized/centered to match the canvas (see app.js resize). -->
  <div id="ui-wrapper">
    <header id="home-page">
      <h1>Infinite board game</h1>
      <a href="https://www.jeremieboulay.fr" target="_blank">@jeremboo</a>
      <div>
        <button type="button" id="start-button">Start</button>
      </div>
    </header>
    <div id="game-page" class="page hidden"></div>

    <!-- Debug: absolute 3×3 screen grid (toggled via dat.GUI debugGrid) -->
    <div id="debug-grid-3x3" class="hidden" aria-hidden="true">
      <span class="debug-grid-3x3__line debug-grid-3x3__line--v" style="left: 33.333%"></span>
      <span class="debug-grid-3x3__line debug-grid-3x3__line--v" style="left: 66.666%"></span>
      <span class="debug-grid-3x3__line debug-grid-3x3__line--h" style="top: 33.333%"></span>
      <span class="debug-grid-3x3__line debug-grid-3x3__line--h" style="top: 66.666%"></span>
    </div>

    <!-- Card UI overlay. Pointer events enabled; engine stays renderer-agnostic. -->
    <div id="card-ui" class="card-ui hidden" aria-hidden="true"></div>

    <aside id="run-stats-debug" class="hidden" aria-hidden="true">
      <div class="run-stats__primary">
        <div class="run-stats__row run-stats__row--score">
          <!-- <span class="label">Score</span> -->
          <span class="value" id="debug-score">0 cells</span>
        </div>
        <div class="run-stats__row run-stats__row--best">
          <span class="label">Best</span>
          <span class="value" id="debug-best">—</span>
        </div>
      </div>
      <details class="stats-details" id="run-stats-details">
        <summary>Details</summary>
        <dl>
          <dt>Cards used</dt><dd id="debug-cards-used">0</dd>
          <dt>Time</dt><dd id="debug-time">0s</dd>
          <dt>Avg think</dt><dd id="debug-think">—</dd>
          <dt>Loots</dt><dd id="debug-loots">0</dd>
          <dd class="cards-line" id="debug-cards-list"></dd>
        </dl>
      </details>
    </aside>

    <div id="game-over" class="hidden" aria-hidden="true" role="dialog" aria-labelledby="game-over-title">
      <div class="game-over__panel">
        <h2 id="game-over-title">Game over</h2>
        <p class="subtitle">No cards left</p>
        <ul class="game-over__stats">
          <li class="game-over__score">
            <span>Score</span>
            <span class="game-over__value">
              <span id="go-score">0 cells</span>
              <span id="go-new-best" class="game-over__badge" hidden>New best!</span>
            </span>
          </li>
          <li class="game-over__best">
            <span>Best</span>
            <span id="go-best">—</span>
          </li>
        </ul>
        <details class="stats-details" id="game-over-details">
          <summary>Details</summary>
          <ul class="game-over__stats">
            <li class="cards-detail">
              <span>Cards used</span>
              <span id="go-cards">0</span>
            </li>
            <li><span>Run time</span><span id="go-time">0s</span></li>
            <li><span>Avg think / turn</span><span id="go-think">—</span></li>
            <li><span>Loots</span><span id="go-loots">0</span></li>
          </ul>
        </details>
        <div class="game-over__actions">
          <button type="button" id="restart-button">Continue</button>
          <!-- <button type="button" id="share-button">Copy stats</button> -->
        </div>
      </div>
    </div>
  </div>

  {{entry}}


</body>
</html>
