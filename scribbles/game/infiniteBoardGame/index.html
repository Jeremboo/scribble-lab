<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="author" content="Jérémie Boulay">
  <meta name="owner" content="Jérémie Boulay">
  <meta name="location" content="Paris, FRANCE">
  <meta name="keywords" content="scribble, lab, creative developer">
  <meta name="description" content="">
  <meta name="copyright" content="© Copyright 2020 - Jérémie Boulay" />
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@jeremboo">
  <meta name="twitter:creator" content="@jeremboo">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="">
  <meta name="twitter:image:src" content="">
  <!-- Facebook -->
  <!-- <meta property="og:title" content="{{title}}"/>
  <meta property="og:image" content=""/>
  <meta property="og:url" content=""/>
  <meta property="og:site-name" content=""/> -->

  <meta name="viewport" content="width=device-width, shrink-to-fit=0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>{{title}}</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
      color: #070707;
      font-family: Century Gothic,CenturyGothic,AppleGothic,sans-serif
    }
    canvas {
      margin: auto;
      display: block;
      box-shadow: 0px 2px 12px -2px rgba(0, 0, 0, 0.15);
    }
    .f {
      position: absolute;
      bottom: 5px;
      right: 15px;
      font-family: 'Arial';
      font-size: 0.7rem;
      text-align: center;
    }
    .f a {
      color: #C9F0FF;
      font-size: 0.8rem;
    }

    a {
      text-decoration: none;
      color: white;
      display: block;
      cursor: pointer;
      transition: color 250ms;
    }

    a:hover {
      color: #B44351
    }

    #wrapper-3d {
      /* Center without CSS transform — parent transforms break CSS3D perspective. */
      position: absolute;
      inset: 0;
      margin: auto;
      font-size: 1px;
      pointer-events: none;
    }

    #wrapper-3d .content {
      width: 1500px;
      height: 1000px;
    }

    #wrapper-3d h1 {
      font-size: 150px;
      line-height: 150px;
      margin:0;
      padding: 0;
      color: white;
    }

    #wrapper-3d a {
      font-size: 70px;
      line-height: 70px;
    }

    #home-page > * {
      opacity: 0;
      transform: translateY(50px);
    }

    #home-page button {
      font-size: 100px;
      transform: translate(0, 0);
      transform-origin: 0 0;
      border: 0;
      cursor: pointer;
      background-color: white;
      transition: background-color 0.25s, transform 0.25s;
      border-radius: 11px;
      margin-left: 10px;
      margin-top: 80px;
      padding: 10px 50px;
    }

    #home-page button:hover {
      transform: translate(10px, 0);
      background-color: #B44351;
    }

    button::-moz-focus-inner {
      border: 0;
      padding: 0;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 1;
      transition: opacity 0.5s;
    }

    .hidden, .hidden button, .hidden a {
      pointer-events: none !important;
      opacity: 0 !important;
    }

    p {
      margin: 5px;
      color: white;
    }

  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="wrapper-3d">
    <div class="content">
      <header id="home-page" class="page">
        <h1>Infinite board game</h1>
        <a href="https://www.jeremieboulay.fr" target="_blank">@jeremboo</a>
        <div>
          <button id="start-button">Start</button>
        </div>
      </header>
      <div id="game-page" class="page hidden"></div>
    </div>
  </div>

  {{entry}}


</body>
</html>
